x-restart: &restart unless-stopped
x-pull_policy: &pull_policy always

name: &name immich

services:
  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:release
    extends:
      file: /etc/nixos/modules/services/immich/hwaccel.transcoding.yml
      service: vaapi
    pull_policy: *pull_policy
    restart: *restart
    volumes:
      - /media/external/data-vault/services/immich/server/data:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Paris
      - DB_USERNAME=postgres
      - DB_DATABASE_NAME=immich
    ports:
      - 2283:2283
    depends_on:
      - redis
      - database
    healthcheck:
      disable: false
    labels:
      - compose2nix.settings.sops.secrets=immich/server/env
      - io.containers.autoupdate=registry

  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:release-openvino
    extends:
      file: /etc/nixos/modules/services/immich/hwaccel.ml.yml
      service: openvino
    pull_policy: *pull_policy
    restart: *restart
    volumes:
      - model-cache:/cache
    healthcheck:
      disable: false
    labels:
      - io.containers.autoupdate=registry

  redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    pull_policy: *pull_policy
    restart: *restart
    healthcheck:
      test: redis-cli ping || exit 1

  database:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    pull_policy: *pull_policy
    restart: *restart
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - /media/external/data-vault/services/immich/postgres/data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false
    labels:
      - compose2nix.settings.sops.secrets=immich/postgres/env

volumes:
  model-cache:
    name: model-cache

networks:
  default:
    name: *name

