x-restart: &restart unless-stopped
x-pull_policy: &pull_policy always

name: &name notes

services:
  joplin:
    container_name: notes-joplin
    image: docker.io/joplin/server:latest
    pull_policy: *pull_policy
    restart: *restart
    environment:
      APP_PORT: 22300
      APP_BASE_URL: https://joplin.gsegt.eu
      DB_CLIENT: pg
      POSTGRES_DATABASE: joplin
      POSTGRES_PORT: 5432
      POSTGRES_HOST: notes-postgres
      STORAGE_DRIVER: Type=Filesystem; Path=/data
    volumes:
      - /media/external/data-vault/services/notes/joplin/data:/data
    ports:
      - 22300:22300
    depends_on:
      - postgres
    labels:
      - compose2nix.settings.sops.secrets=notes/joplin/env
      - io.containers.autoupdate=registry

  postgres:
    container_name: notes-postgres
    image: docker.io/library/postgres:16-alpine
    pull_policy: *pull_policy
    restart: *restart
    environment:
       POSTGRES_DB: joplin
    volumes:
      - /media/external/data-vault/services/notes/postgres/data:/var/lib/postgresql/data
    labels:
      - compose2nix.settings.sops.secrets=notes/postgres/env
      - io.containers.autoupdate=registry

networks:
  default:
    name: *name

