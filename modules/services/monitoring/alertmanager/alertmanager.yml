# Routes alerts from ../prometheus/alerts.yml.
# Secrets are files mounted into /etc/alertmanager/secrets (sops-nix on NixOS):
#   smtp_password    - SMTP password (same account as the msmtp module)
#   ntfy_token       - write-only token for the `alerts` topic on the
#                      notifications service (self-hosted ntfy)
#   healthcheck_url  - healthchecks.io ping URL, e.g. https://hc-ping.com/<uuid>
# Test with: amtool check-config alertmanager.yml

global:
  smtp_smarthost: smtp.mail.ovh.net:587
  smtp_from: Aspire alerts <sysadmin@gsegt.eu>
  smtp_auth_username: mail@gsegt.eu
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp_password
  smtp_require_tls: true

route:
  receiver: email
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # Heartbeat: ping every minute; healthchecks.io alerts when pings stop.
    - matchers: [alertname="Watchdog"]
      receiver: healthchecks
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - matchers: [severity="critical"]
      receiver: email-and-ntfy
      repeat_interval: 4h

# Don't send the warning when the critical version of the same alert fires.
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, instance, zpool, mountpoint, device]

receivers:
  - name: email
    email_configs:
      - to: mail@gsegt.eu
        send_resolved: true

  - name: email-and-ntfy
    email_configs:
      - to: mail@gsegt.eu
        send_resolved: true
    webhook_configs:
      # ntfy's built-in template turns the webhook JSON into a readable push
      - url: https://notifications.gsegt.eu/alerts?template=alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/ntfy_token

  - name: healthchecks
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/healthcheck_url
        send_resolved: false
