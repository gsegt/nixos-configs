global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093
    scheme: http
    timeout: 10s
    api_version: v2
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prometheus
    honor_timestamps: true
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    static_configs:
    - targets:
      - localhost:9090
  - job_name: prometheus-node-exporter
    honor_timestamps: true
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
        - host.containers.internal:9100
  - job_name: esphome
    honor_timestamps: true
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    # Plugs label their metrics with node="plug-<device>" themselves
    static_configs:
      - targets:
        - 192.168.1.246 # plug-3d-printer
        - 192.168.1.247 # plug-tv
        - 192.168.1.248 # plug-server
        - 192.168.1.249 # plug-desktop
  - job_name: smartctl
    honor_timestamps: true
    # The exporter only re-reads SMART data once a minute
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
        - host.containers.internal:9633
  - job_name: zfs
    honor_timestamps: true
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
        - host.containers.internal:9700
  - job_name: podman
    honor_timestamps: true
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
        - podman-exporter:9882
  - job_name: blackbox
    honor_timestamps: true
    scrape_interval: 60s
    scrape_timeout: 15s
    metrics_path: /probe
    scheme: http
    params:
      module: [http_2xx]
    # Targets are generated from the Caddy virtual hosts (see default.nix)
    file_sd_configs:
      - files:
        - /etc/prometheus-file-sd/blackbox.json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: alertmanager
    honor_timestamps: true
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
        - alertmanager:9093
