x-restart: &restart unless-stopped
x-pull_policy: &pull_policy always
x-puid: &puid PUID=1000
x-pgid: &pgid PGID=1000
x-tz: &tz TZ=Europe/Paris
x-data: &data "/media/external/data-vault/services/media-server:/data"
x-media: &media "/media/external/data-vault/services/media-server/media:/data/media"
x-torrents: &torrents "/media/external/data-vault/services/media-server/torrents:/data/torrents"

name: &name media-server

services:
  bazarr:
    container_name: media-server-bazarr
    image: lscr.io/linuxserver/bazarr:latest
    pull_policy: *pull_policy
    restart: *restart
    ports:
      - 6767:6767
    environment:
      - *puid
      - *pgid
      - *tz
    volumes:
      - *media
      - /media/external/data-vault/services/media-server/bazarr/config:/config
    labels:
      - io.containers.autoupdate=registry

  clonarr:
    container_name: media-server-clonarr
    image: ghcr.io/prophetse7en/clonarr:latest
    pull_policy: *pull_policy
    restart: *restart
    ports:
      - 6060:6060
    environment:
      - *puid
      - *pgid
      - *tz
    volumes:
      - /media/external/data-vault/services/media-server/clonarr/config:/config
    labels:
      - io.containers.autoupdate=registry

  prowlarr:
    container_name: media-server-prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    pull_policy: *pull_policy
    restart: *restart
    ports:
      - 9696:9696
    environment:
      - *puid
      - *pgid
      - *tz
    volumes:
      - /media/external/data-vault/services/media-server/prowlarr/config:/config
    labels:
      - io.containers.autoupdate=registry

  radarr:
    container_name: media-server-radarr
    image: lscr.io/linuxserver/radarr:latest
    pull_policy: *pull_policy
    restart: *restart
    ports:
      - 7878:7878
    environment:
      - *puid
      - *pgid
      - *tz
    volumes:
      - *data
      - /media/external/data-vault/services/media-server/radarr/config:/config
    labels:
      - io.containers.autoupdate=registry

  sonarr:
    container_name: media-server-sonarr
    image: lscr.io/linuxserver/sonarr:latest
    pull_policy: *pull_policy
    restart: *restart
    ports:
      - 8989:8989
    environment:
      - *puid
      - *pgid
      - *tz
    volumes:
      - *data
      - /media/external/data-vault/services/media-server/sonarr/config:/config
    labels:
      - io.containers.autoupdate=registry

networks:
  default:
    name: *name

