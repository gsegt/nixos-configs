x-restart: &restart unless-stopped
x-pull_policy: &pull_policy always

name: &name photos

services:
  immich-server:
    container_name: photos-immich-server
    image: ghcr.io/immich-app/immich-server:release
    extends:
      file: /etc/nixos/modules/services/photos/hwaccel.transcoding.yml
      service: vaapi
    pull_policy: *pull_policy
    restart: *restart
    volumes:
      - /media/external/data-vault/services/photos/immich-server/data:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Europe/Paris
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
    ports:
      - 2283:2283
    depends_on:
      - redis
      - database
    healthcheck:
      disable: false
    labels:
      - compose2nix.settings.sops.secrets=photos/immich-server/env
      - io.containers.autoupdate=registry

  immich-machine-learning:
    container_name: photos-immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:release-openvino
    extends:
      file: /etc/nixos/modules/services/photos/hwaccel.ml.yml
      service: openvino
    pull_policy: *pull_policy
    restart: *restart
    volumes:
      - model-cache:/cache
    healthcheck:
      disable: false
    labels:
      - io.containers.autoupdate=registry

  redis:
    container_name: photos-redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    pull_policy: *pull_policy
    restart: *restart
    healthcheck:
      test: redis-cli ping || exit 1

  database:
    container_name: photos-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    pull_policy: *pull_policy
    restart: *restart
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - /media/external/data-vault/services/photos/postgres/data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false
    labels:
      - compose2nix.settings.sops.secrets=photos/postgres/env

volumes:
  model-cache:
    name: photos-immich-machine-learning-model-cache

networks:
  default:
    name: *name

