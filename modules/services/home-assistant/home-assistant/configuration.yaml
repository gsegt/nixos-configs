# Mounted read-only over /config/configuration.yaml. Settings made in the UI
# (integrations, users, dashboards, automations) are stored in the writable
# /config volume instead. The ESPHome plugs are added from the UI: Settings →
# Devices & services → Add integration → ESPHome (see esphome/README.md).

# Default integrations (frontend, history, logbook, mobile app, ...)
default_config:

homeassistant:
  # Keep in sync with the domain in default.nix
  external_url: https://home.gsegt.eu

# No http: block, it is configured in the UI (Settings → System → Network).
# Behind the reverse proxy it must use X-Forwarded-For and trust the container
# network, 10.89.100.0/24 (the proxy reaches the container from its gateway);
# keep it in sync with the subnet in default.nix.

# Written by the UI editors; default.nix creates these files when missing.
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
